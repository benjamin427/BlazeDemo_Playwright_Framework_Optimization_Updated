name: Testing from production environment


on:
    push:
        branches: [main]
        
    pull_request:
        branches: [main]

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            playwright: ${{ steps.filter.outputs.playwright }}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                filters: |
                    playwright:
                        - 'production/**'
                        - 'playwright.config.js'
#                        - 'production/mock_api_tests/**'
#                        - 'production/regression/**'
#                        - 'production/sanity/**'
#                        - 'production/smoke/**'
                        
    
    test:
        needs: changes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install dependencies
              run: npm ci

            - name: Run Playwright tests in production environment for testing mock apis
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Production/Mock_Api_Tests/Api_Test.spec.js --testMatch="**/*.js"
            
            - name: Run Playwright tests in production environment to test edge case test cases in sanity test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Production/Regression/Edge_Case_Tests --testMatch="**/*.js"
            
            - name: Run Playwright tests in production environment for testing flight purchase verification in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Production/Regression/Flight_Purchase_Verification.spec.js --testMatch="**/*.js"
            
            - name: Run Playwright tests in production environment for testing login application in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Production/Regression/Login.spec.js --testMatch="**/*.js"

            - name: Run Playwright tests in production environment for testing departure and destination menu for each city in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Production/Regression/Menu_Departure_Destination_City.spec.js --testMatch="**/*.js"
              
            - name: Run Playwright tests in production environment for testing register form in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Production/Regression/Register.spec.js --testMatch="**/*.js"
            
            - name: Run Playwright tests in production environment to test edge case test cases in sanity test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Production/Sanity/Edge_Case_Tests --testMatch="**/*.js"

            - name: Run Playwright tests in production environment for testing flight purchase verification in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Production/Sanity/Flight_Purchase_Verification.spec.js --testMatch="**/*.js"
            
            - name: Run Playwright tests in production environment for testing login application in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Production/Sanity/Login.spec.js --testMatch="**/*.js"

            - name: Run Playwright tests in production environment for testing departure and destination menu for each city in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Production/Sanity/Menu_Departure_Destination_City.spec.js --testMatch="**/*.js"
              
            - name: Run Playwright tests in production environment for testing register form in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Production/Sanity/Register.spec.js --testMatch="**/*.js"

            - name: No-op success
              if: needs.changes.outputs.playwright == 'false'
              run: echo "No playwright changes detected"


