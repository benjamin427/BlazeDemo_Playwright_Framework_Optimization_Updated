name: Testing from live environment

on:
    push:
        branches: [main]
         
    pull_request:
        branches: [main]

jobs:
    # Stage 1. Check what changed
    changes:
        runs-on: ubuntu-latest
        outputs:
            playwright: ${{steps.filter.outputs.playwright}}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                filters: |
                    playwright:
                        - 'live/**'
                        - 'playwright.config.js'
#                        - 'live/mock_api_tests/**'
#                        - 'live/regression/**'
#                        - 'live/sanity/**'
#                        - 'live/smoke/**'
                      
    
    # Stage 2. Run tests conditionally
    test:
        needs: changes
        # Always runs its block, but skips if no changes occured
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install dependencies
              run: npm ci

            - name: Run Playwright tests in live environment for testing mock apis
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Live/Mock_Api_Tests/Api_Test.spec.js --testMatch="**/*.js"
            
            - name: Run Playwright tests in live environment to test edge case test cases in sanity test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Live/Regression/Edge_Case_Tests --testMatch="**/*.js"
            
            - name: Run Playwright tests in live environment for testing flight purchase verification in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Live/Regression/Flight_Purchase_Verification.spec.js --testMatch="**/*.js"
            
            - name: Run Playwright tests in live environment for testing login application in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Live/Regression/Login.spec.js --testMatch="**/*.js"
 
            - name: Run Playwright tests in live environment for testing departure and destination menu for each city in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Live/Regression/Menu_Departure_Destination_City.spec.js --testMatch="**/*.js"
              
            - name: Run Playwright tests in live environment for testing register form in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Live/Regression/Register.spec.js --testMatch="**/*.js"
            
            - name: Run Playwright tests in live environment to test edge case test cases in sanity test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Live/Sanity/Edge_Case_Tests --testMatch="**/*.js"

            - name: Run Playwright tests in live environment for testing flight purchase verification in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Live/Sanity/Flight_Purchase_Verification.spec.js --testMatch="**/*.js"
            
            - name: Run Playwright tests in live environment for testing login application in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Live/Sanity/Login.spec.js --testMatch="**/*.js"

            - name: Run Playwright tests in live environment for testing departure and destination menu for each city in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Live/Sanity/Menu_Departure_Destination_City.spec.js --testMatch="**/*.js"
              
            - name: Run Playwright tests in live environment for testing register form in regression test suite
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test tests/Live/Sanity/Register.spec.js --testMatch="**/*.js"

            # If no changes occur
            - name: No-op Success
              if: needs.changes.outputs.playwright == 'false'
              run: echo "No playwright changes detected. Skipping test safely"
