name: Testing from live environment


on: 
    pull_request:
        branches: [main]

jobs:
    # Stage 1. Check what changed
    changes:
        runs-on: ubuntu
        outputs:
            playwright: ${{steps.filter.outputs.playwright}}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                filters: |
                    playwright:
                        - '/live/**'
                        - 'playwright.config.js'
    
    # Stage 2. Run tests conditionally
    test:
        needs: changes
        # Always runs its block, but skips if no changes occured
        runs-on: ubuntu
        steps:
            - uses: actions/checkout@v4
            - name: Install dependencies
              if: needs.changes.outputs.playwright == 'true'
              run: npm ci

            - name: Run Playwright tests
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test
            # If no changes occur
            - name: No-op Success
              if: needs.changes.outputs.playwright == 'false'
              run: echo "No playwright changes detected. Skipping test safely"
