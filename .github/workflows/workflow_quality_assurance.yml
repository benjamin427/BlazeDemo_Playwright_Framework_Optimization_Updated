name: Testing from quality assurance environment


on:
    push:
        branches: [main]
        
    pull_request:
        branches: [main]

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs: 
            playwright: ${{ steps.filter.outputs.playwright }}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                filters: |
                    playwright:
                        - 'quality_assurance/**'
                        - 'playwright.config.js'
#                        - 'quality_assurance/mock_api_tests/**'
#                        - 'quality_assurance/regression/**'
#                        - 'quality_assurance/sanity/**'
#                        - 'quality_assurance/smoke/**'
    tests:
        needs: changes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install dependencies
              if: needs.changes.outputs.playwright == 'true'
              run: npm ci
            
            - name: Run Playwright tests
              if: needs.changes.outputs.playwright == 'true'
              run: npx playwright test
            
            - name: No-op changes
              if: needs.changes.outputs.playwright == 'false'
              run: echo "No playwright changes detected"

                


